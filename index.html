<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цветовые модели: CMYK-RGB-HSV</title>

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 18px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 16px;
    }

    .top {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .preview {
      width: 180px;
      height: 90px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #ff0000;
    }

    .hex {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .muted {
      color: #555;
      margin: 8px 0 0;
      max-width: 600px;
    }

    input[type="color"] {
      width: 60px;
      height: 36px;
      padding: 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }

    .models {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 11rem 1fr 5.5rem;
      gap: 8px;
      align-items: center;
      margin: 10px 0;
    }

    .row label {
      font-size: 0.95rem;
    }

    input[type="range"] {
      width: 100%;
    }

    input[type="number"] {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      text-align: right;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Лабораторная работа 1: CMYK — RGB — HSV</h1>

    <section class="top card">
      <div id="preview" class="preview"></div>

      <div>
        <label for="palette">Выбрать цвет из палитры:</label>
        <input type="color" id="palette" value="#ff0000">

        <div id="hex" class="hex">#FF0000</div>

        <p class="muted">
          Цвет можно задавать тремя способами: через палитру, ползунками или точными значениями в полях.
          Числовые поля применяются по <b>Enter</b> или после потери фокуса.
          При изменении любого компонента все остальные модели пересчитываются автоматически.
        </p>
      </div>
    </section>

    <section id="models" class="models"></section>
  </main>

  <script>
    "use strict";

    const MODELS = [
      {
        id: "CMYK",
        title: "CMYK (значения в %)",
        components: [
          { key: "C", label: "C — Cyan, %", min: 0, max: 100, step: 0.1 },
          { key: "M", label: "M — Magenta, %", min: 0, max: 100, step: 0.1 },
          { key: "Y", label: "Y — Yellow, %", min: 0, max: 100, step: 0.1 },
          { key: "K", label: "K — Black, %", min: 0, max: 100, step: 0.1 }
        ]
      },
      {
        id: "RGB",
        title: "RGB (0–255)",
        components: [
          { key: "R", label: "R — Red", min: 0, max: 255, step: 1 },
          { key: "G", label: "G — Green", min: 0, max: 255, step: 1 },
          { key: "B", label: "B — Blue", min: 0, max: 255, step: 1 }
        ]
      },
      {
        id: "HSV",
        title: "HSV (H: 0–360°, S/V: %)",
        components: [
          { key: "H", label: "H — Hue, °", min: 0, max: 360, step: 0.1 },
          { key: "S", label: "S — Saturation, %", min: 0, max: 100, step: 0.1 },
          { key: "V", label: "V — Value, %", min: 0, max: 100, step: 0.1 }
        ]
      }
    ];

    const controls = {
      CMYK: {},
      RGB: {},
      HSV: {}
    };

    let state = {
      CMYK: { C: 0, M: 0, Y: 0, K: 0 },
      RGB: { R: 255, G: 0, B: 0 },
      HSV: { H: 0, S: 0, V: 0 }
    };

    let updating = false;

    function clamp(value, min, max) {
      const num = Number(value);
      if (!Number.isFinite(num)) return min;
      return Math.min(max, Math.max(min, num));
    }

    function mod(value, modulo) {
      return ((value % modulo) + modulo) % modulo;
    }

    function rgbToCmyk(R, G, B) {
      const r = clamp(R, 0, 255) / 255;
      const g = clamp(G, 0, 255) / 255;
      const b = clamp(B, 0, 255) / 255;

      const max = Math.max(r, g, b);
      const k = 1 - max;

      if (max <= 0) {
        return { C: 0, M: 0, Y: 0, K: 100 };
      }

      return {
        C: clamp(((1 - r - k) / (1 - k)) * 100, 0, 100),
        M: clamp(((1 - g - k) / (1 - k)) * 100, 0, 100),
        Y: clamp(((1 - b - k) / (1 - k)) * 100, 0, 100),
        K: clamp(k * 100, 0, 100)
      };
    }

    function cmykToRgb(C, M, Y, K) {
      const c = clamp(C, 0, 100) / 100;
      const m = clamp(M, 0, 100) / 100;
      const y = clamp(Y, 0, 100) / 100;
      const k = clamp(K, 0, 100) / 100;

      const r = 255 * (1 - c) * (1 - k);
      const g = 255 * (1 - m) * (1 - k);
      const b = 255 * (1 - y) * (1 - k);

      return {
        R: Math.round(clamp(r, 0, 255)),
        G: Math.round(clamp(g, 0, 255)),
        B: Math.round(clamp(b, 0, 255))
      };
    }

    function rgbToHsv(R, G, B) {
      const r = clamp(R, 0, 255) / 255;
      const g = clamp(G, 0, 255) / 255;
      const b = clamp(B, 0, 255) / 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const delta = max - min;

      let h = 0;

      if (delta !== 0) {
        if (max === r) {
          h = 60 * mod((g - b) / delta, 6);
        } else if (max === g) {
          h = 60 * ((b - r) / delta + 2);
        } else {
          h = 60 * ((r - g) / delta + 4);
        }
      }

      h = mod(h, 360);

      const s = max <= 0 ? 0 : (delta / max) * 100;
      const v = max * 100;

      return {
        H: clamp(h, 0, 360),
        S: clamp(s, 0, 100),
        V: clamp(v, 0, 100)
      };
    }

    function hsvToRgb(H, S, V) {
      const h = mod(H, 360);
      const s = clamp(S, 0, 100) / 100;
      const v = clamp(V, 0, 100) / 100;

      const c = v * s;
      const x = c * (1 - Math.abs(mod(h / 60, 2) - 1));
      const m = v - c;

      let r = 0;
      let g = 0;
      let b = 0;

      if (h < 60) {
        [r, g, b] = [c, x, 0];
      } else if (h < 120) {
        [r, g, b] = [x, c, 0];
      } else if (h < 180) {
        [r, g, b] = [0, c, x];
      } else if (h < 240) {
        [r, g, b] = [0, x, c];
      } else if (h < 300) {
        [r, g, b] = [x, 0, c];
      } else {
        [r, g, b] = [c, 0, x];
      }

      return {
        R: Math.round(clamp((r + m) * 255, 0, 255)),
        G: Math.round(clamp((g + m) * 255, 0, 255)),
        B: Math.round(clamp((b + m) * 255, 0, 255))
      };
    }

    function rgbToHex(R, G, B) {
      return (
        "#" +
        [R, G, B]
          .map(channel => Math.round(clamp(channel, 0, 255)).toString(16).padStart(2, "0"))
          .join("")
      );
    }

    function hexToRgb(hex) {
      let value = hex.replace("#", "").trim();

      if (value.length === 3) {
        value = value
          .split("")
          .map(ch => ch + ch)
          .join("");
      }

      const num = parseInt(value, 16);

      return {
        R: (num >> 16) & 255,
        G: (num >> 8) & 255,
        B: num & 255
      };
    }

    function formatValue(model, value) {
      if (model === "RGB") {
        return Math.round(value);
      }

      return Number(value).toFixed(1);
    }

    function getCfg(model, key) {
      return MODELS
        .find(m => m.id === model)
        .components.find(c => c.key === key);
    }

    function createUI() {
      const modelsContainer = document.getElementById("models");

      MODELS.forEach(model => {
        const card = document.createElement("section");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = model.title;
        card.appendChild(title);

        model.components.forEach(comp => {
          const row = document.createElement("div");
          row.className = "row";

          const label = document.createElement("label");
          label.htmlFor = `${model.id}-${comp.key}`;
          label.textContent = comp.label;

          const range = document.createElement("input");
          range.type = "range";
          range.id = `${model.id}-${comp.key}`;
          range.min = comp.min;
          range.max = comp.max;
          range.step = comp.step;
          range.dataset.model = model.id;
          range.dataset.comp = comp.key;

          const number = document.createElement("input");
          number.type = "number";
          number.id = `${model.id}-${comp.key}-number`;
          number.min = comp.min;
          number.max = comp.max;
          number.step = comp.step;
          number.dataset.model = model.id;
          number.dataset.comp = comp.key;

          row.appendChild(label);
          row.appendChild(range);
          row.appendChild(number);
          card.appendChild(row);

          controls[model.id][comp.key] = { range, number };

          range.addEventListener("input", onControlInput);
          number.addEventListener("change", onControlInput);

          number.addEventListener("keydown", event => {
            if (event.key === "Enter") {
              number.blur();
            }
          });
        });

        modelsContainer.appendChild(card);
      });
    }

    function onControlInput(event) {
      if (updating) return;

      const model = event.target.dataset.model;
      const key = event.target.dataset.comp;
      const cfg = getCfg(model, key);

      const raw = event.target.value.trim();

      let value;

      if (raw === "") {
        value = state[model][key];
      } else {
        value = Number(raw);

        if (!Number.isFinite(value)) {
          value = state[model][key];
        }
      }

      value = clamp(value, cfg.min, cfg.max);

      if (model === "RGB") {
        value = Math.round(value);
      }

      const values = {
        ...state[model],
        [key]: value
      };

      apply(model, values);
    }

    function apply(model, values) {
      updating = true;

      try {
        if (model === "RGB") {
          state.RGB = {
            R: Math.round(clamp(values.R, 0, 255)),
            G: Math.round(clamp(values.G, 0, 255)),
            B: Math.round(clamp(values.B, 0, 255))
          };

          state.CMYK = rgbToCmyk(state.RGB.R, state.RGB.G, state.RGB.B);
          state.HSV = rgbToHsv(state.RGB.R, state.RGB.G, state.RGB.B);

        } else if (model === "CMYK") {
          state.CMYK = {
            C: clamp(values.C, 0, 100),
            M: clamp(values.M, 0, 100),
            Y: clamp(values.Y, 0, 100),
            K: clamp(values.K, 0, 100)
          };

          state.RGB = cmykToRgb(
            state.CMYK.C,
            state.CMYK.M,
            state.CMYK.Y,
            state.CMYK.K
          );

          state.HSV = rgbToHsv(
            state.RGB.R,
            state.RGB.G,
            state.RGB.B
          );

        } else if (model === "HSV") {
          state.HSV = {
            H: clamp(values.H, 0, 360),
            S: clamp(values.S, 0, 100),
            V: clamp(values.V, 0, 100)
          };

          state.RGB = hsvToRgb(
            state.HSV.H,
            state.HSV.S,
            state.HSV.V
          );

          state.CMYK = rgbToCmyk(
            state.RGB.R,
            state.RGB.G,
            state.RGB.B
          );
        }

        render();
      } finally {
        updating = false;
      }
    }

    function render() {
      for (const model of MODELS) {
        for (const comp of model.components) {
          const control = controls[model.id][comp.key];
          const value = state[model.id][comp.key];

          control.range.value = value;

          if (document.activeElement !== control.number) {
            control.number.value = formatValue(model.id, value);
          }
        }
      }

      const hex = rgbToHex(state.RGB.R, state.RGB.G, state.RGB.B);

      document.getElementById("preview").style.background = hex;
      document.getElementById("hex").textContent = hex.toUpperCase();

      const palette = document.getElementById("palette");

      if (document.activeElement !== palette) {
        palette.value = hex;
      }
    }

    document.getElementById("palette").addEventListener("input", event => {
      if (updating) return;

      const rgb = hexToRgb(event.target.value);

      apply("RGB", rgb);
    });

    createUI();

    apply("RGB", {
      R: 255,
      G: 0,
      B: 0
    });
  </script>
</body>
</html>
